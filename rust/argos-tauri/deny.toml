# 🟢 cargo deny de la coque Tauri (lancé par `make tauri`). Mêmes règles que ../deny.toml, plus ce que Tauri amène :

[graph]
all-features = false

[advisories]
# Versions retirées (yanked) : refusées. Failles et code « unsound » : refusés. Crates « plus maintenues » : refusées
# sauf les exceptions listées ci-dessous, chacune avec sa raison (suivies dans docs/dependances-a-approuver.md,
# section « À surveiller ») : cargo deny 0.20 n'a plus de niveau « warn » pour elles, la liste sert d'avertissement.
yanked = "deny"
unmaintained = "all"
ignore = [
    # proc-macro-error : macro de compilation des liaisons GTK 3 (gtk-rs 0.18) que Tauri 2 utilise sous Linux
    # (menus, fenêtre WebKitGTK). Pas de faille ; partira quand Tauri passera à GTK 4.
    { id = "RUSTSEC-2024-0370", reason = "via glib-macros (GTK 3 de Tauri sous Linux) ; pas de faille" },
    # chrono: dates and times (argos-data, in the shell through the WASM chart). Same exception as ../deny.toml:
    # advisory of 17 Nov 2026: unmaintained, no fixed version. Allowed by Jee (« ok exception chrono », 17 Nov 2026);
    # moving to jiff is a separate project, with Jee's approval (a new crate).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no vulnerability; no fixed version; migration to jiff planned as a separate project with Jee's approval (17 Nov 2026)" },
]

[licenses]
# Comme ../deny.toml, plus MPL-2.0 : cssparser, cssparser-macros, selectors, dtoa-short (lecture du CSS / CSP par
# Tauri) et option-ext (dossiers du système). MPL-2.0 = copyleft par fichier (seuls leurs fichiers, s'ils étaient
# modifiés, devraient rester publiés) : acceptée par Jee le 6 nov.
# 🚫 GPL, AGPL, LGPL ou toute licence qui oblige à ouvrir l'app : interdites (absentes de la liste, donc refusées).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# deux versions d'une même crate : signalé (pas bloquant) ; version « * » : refusée (nos crates par chemin permises)
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# seulement crates.io ; aucun dépôt git, aucun autre registre
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
