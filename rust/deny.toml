# 🟢 cargo deny (règle des modules : chaque version « toute verte » dans Cargo : fmt, clippy, test, audit, deny).
# Lancé par `make vert`. Rien de payant, tout en local.

[graph]
all-features = false

[advisories]
# Versions retirées (yanked) : refusées. Failles et code « unsound » : refusés. Crates « plus maintenues » : refusées
# sauf les exceptions listées ci-dessous, chacune avec sa raison (suivies dans docs/dependances-a-approuver.md,
# section « À surveiller ») : cargo deny 0.20 n'a plus de niveau « warn » pour elles, la liste sert d'avertissement.
yanked = "deny"
unmaintained = "all"
# Failles : toujours refusées. Les crates « plus maintenues » ci-dessous sont notées avec leur raison ; à revoir à
# chaque mise à jour de winit, fontdue ou keyring (aucune n'a de faille connue).
ignore = [
    # ttf-parser : lecteur de polices tiré par fontdue (texte d'argos-render) et winit (barre de titre Wayland).
    # Pas de remplaçant simple : il faudrait changer de moteur de texte.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdue et winit ; pas de faille, remplacement = nouveau moteur de texte" },
    # zbus_names, zvariant, zvariant_derive : D-Bus de Linux, tirés par keyring (trousseau du système pour les clés API
    # sur desktop). Disparaîtront avec keyring 4 / zbus 5.
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via keyring (trousseau Linux) ; pas de faille" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via keyring (trousseau Linux) ; pas de faille" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via keyring (trousseau Linux) ; pas de faille" },
    # chrono and chrono-tz: dates, times and time zones all over Argos (data, render, script, desktop, serveur).
    # Advisories of 17 Nov 2026: unmaintained, no fixed version. Allowed by Jee (« ok exception chrono », 17 Nov 2026);
    # moving to jiff is a separate project, with Jee's approval (a new crate).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no vulnerability; no fixed version; migration to jiff planned as a separate project with Jee's approval (17 Nov 2026)" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; no vulnerability; no fixed version; migration to jiff planned as a separate project with Jee's approval (17 Nov 2026)" },
]

[licenses]
# Nos crates sont sous PolyForm Noncommercial 1.0.0 (licence d'Argos HSS Trading, © Jee) : publish = false, donc
# non vérifiées ici ([licenses.private]). Cette licence n'est PAS dans la liste : une dépendance sous licence
# non commerciale serait refusée aussi.
# 🚫 Règle de Jee (6 nov.) : GPL, AGPL, LGPL ou toute licence qui oblige à ouvrir l'app sont INTERDITES. Elles ne sont
# pas dans la liste ci-dessous, donc cargo deny refuse toute dépendance qui en a une. MPL-2.0 est acceptée (coque Tauri).
# Licences permises pour les dépendances (relevées avec cargo metadata) : toutes permissives, compatibles avec
# une licence propriétaire (aucune GPL / AGPL / LGPL imposée). Nos crates (publish = false) ne sont pas vérifiées.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# deux versions d'une même crate : signalé (pas bloquant) ; version « * » : refusée (nos crates par chemin permises)
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# seulement crates.io ; aucun dépôt git, aucun autre registre
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
