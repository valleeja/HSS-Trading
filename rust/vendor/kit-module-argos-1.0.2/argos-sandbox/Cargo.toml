[package]
name = "argos-sandbox"
version = "0.1.0"
description = "Argos module sandbox: approved WASM only, explicit capabilities, fuel, memory and time limits"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
argos-module-policy = { path = "../argos-module-policy" }
argos-module-sdk = { path = "../argos-module-sdk" }
serde = { version = "1", features = ["derive"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
wasmtime = { version = "=50.0.2", default-features = false, features = ["runtime", "cranelift", "std"] }

[dev-dependencies]
tempfile = "3"
wat = "1"

[workspace]
