[package]
name = "argos-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
hex = "0.4.3"
# 💰 prix × quantité en décimales exactes (déjà utilisé par argos-lens, même version)
rust_decimal = { version = "1.43", default-features = false }
k256 = { version = "0.14.0", features = ["schnorr"] }
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
