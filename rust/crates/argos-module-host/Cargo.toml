[package]
name = "argos-module-host"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Modules d'Argos HSS Trading avec le kit module Argos 1.0.2 (interface v2) : manifeste, droits, données, bulle du kit"

[dependencies]
argos-module-sdk = { path = "../../vendor/kit-module-argos-1.0.2/argos-module-sdk" }
argos-module-policy = { path = "../../vendor/kit-module-argos-1.0.2/argos-module-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmparser = { version = "0.261", default-features = false, features = ["std"] }

# la bulle du kit (wasmtime, fichiers) : desktop seulement ; le navigateur a son Web Worker (app/module-worker.js)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argos-sandbox = { path = "../../vendor/kit-module-argos-1.0.2/argos-sandbox" }

[lints]
workspace = true
