[package]
name = "argos-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Argos AI level 1: rule-based readings of the built-in indicators, in simple French; pure computation, no network"

[dependencies]
argos-core = { path = "../argos-core" }
argos-lens = { path = "../argos-lens" }
argos-script = { path = "../argos-script" }

[dev-dependencies]
# real examples on cached candles (the `real_examples_from_the_cache` test only)
argos-data = { path = "../argos-data", features = ["native"] }

[lints]
workspace = true
