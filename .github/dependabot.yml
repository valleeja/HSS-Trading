# 🛡️ Mises à jour de sécurité proposées chaque semaine (bibliothèques Rust et actions GitHub).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
